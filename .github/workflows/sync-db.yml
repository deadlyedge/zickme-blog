name: Sync Content to Database
on:
  workflow_run:
    workflows: ['Upload Media to Cloudinary']
    types: [completed]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm i --legacy-peer-deps
          npm install tsx --legacy-peer-deps

      - name: Sync to Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npx prisma generate
          npx prisma db push
          npx tsx scripts/sync-content.ts  # tsx 兼容 Bun，比 npx 快
